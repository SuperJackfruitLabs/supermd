[package]
name = "supermd"
version = "0.0.2"
edition = "2021"

[dependencies]
# runtime_shaders: compile Metal shaders at launch — avoids requiring full Xcode
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
pulldown-cmark = "0.13"
ropey = "1"
nucleo-matcher = "0.3.1"
unicode-segmentation = "1"
notify = "6"
anyhow = "1.0.104"
inkjet = { version = "0.11.1", features = ["all_languages"] }
tree-sitter-xml = "0.7"
tree-sitter = "0.23"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
similar = { version = "2", features = ["unicode"] }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
ignore = "0.4.33"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"

# gpui is heavy; keep debug builds usable
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
