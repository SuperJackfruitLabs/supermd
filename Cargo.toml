[package]
name = "supermd"
version = "0.1.0"
edition = "2021"

[dependencies]
# runtime_shaders: compile Metal shaders at launch — avoids requiring full Xcode
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
pulldown-cmark = "0.13"
ropey = "1"
tree-sitter-highlight = "0.26"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
nucleo-matcher = "0.3.1"
unicode-segmentation = "1"
notify = "6"
anyhow = "1.0.104"

[dev-dependencies]
tempfile = "3"

# gpui is heavy; keep debug builds usable
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
