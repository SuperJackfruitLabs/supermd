[package]
name = "supermd"
version = "0.1.0"
edition = "2021"

[dependencies]
# runtime_shaders: compile Metal shaders at launch — avoids requiring full Xcode
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
pulldown-cmark = "0.13"
ropey = "1"
tree-sitter-highlight = "0.26"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
nucleo-matcher = "0.3.1"
unicode-segmentation = "1"
notify = "6"
anyhow = "1.0.104"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-ruby = "0.23"
tree-sitter-java = "0.23"
tree-sitter-php = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-lua = "0.5"
tree-sitter-elixir = "0.3"
tree-sitter-haskell = "0.23"
tree-sitter-ocaml = "0.25"
tree-sitter-scala = "0.26"
tree-sitter-julia = "0.23"
tree-sitter-zig = "1.1"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-swift = "0.7"
tree-sitter-elm = "5.9"
tree-sitter-erlang = "0.20"
tree-sitter-sequel = "0.3"
tree-sitter-xml = "0.7"
tree-sitter-regex = "0.25"
tree-sitter-nix = "0.3"
tree-sitter-r = "1.3"
tree-sitter-gleam = "1.0"
tree-sitter-svelte-ng = "1.0"
tree-sitter-vue = "0.0.3"
tree-sitter-dart = "0.2"
tree-sitter-nim = "0.1"
tree-sitter-dockerfile = "0.2"
tree-sitter-d = "0.8"
tree-sitter-perl = "1.1"
tree-sitter-graphql = "0.2"

[dev-dependencies]
tempfile = "3"

# gpui is heavy; keep debug builds usable
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
