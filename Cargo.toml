[package]
name = "supermd"
version = "0.1.0"
edition = "2021"

[dependencies]
# runtime_shaders: compile Metal shaders at launch — avoids requiring full Xcode
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
pulldown-cmark = "0.13"
ropey = "1"
nucleo-matcher = "0.3.1"
unicode-segmentation = "1"
notify = "6"
anyhow = "1.0.104"
inkjet = { version = "0.11.1", features = ["all_languages"] }
tree-sitter-xml = "0.7"
tree-sitter = "0.23"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"

# gpui is heavy; keep debug builds usable
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
