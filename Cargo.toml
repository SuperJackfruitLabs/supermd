[package]
name = "supermd"
version = "0.0.9"
edition = "2021"

[dependencies]
# runtime_shaders: compile Metal shaders at launch — avoids requiring full Xcode
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
pulldown-cmark = "0.13"
ropey = "1"
nucleo-matcher = "0.3.1"
unicode-segmentation = "1"
notify = "6"
anyhow = "1.0.104"
inkjet = { version = "0.11.1", features = ["all_languages"] }
tree-sitter-xml = "0.7"
tree-sitter = { version = "0.23", features = ["wasm"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
similar = { version = "2", features = ["unicode"] }
ignore = "0.4.33"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
gix = { version = "0.87.0", default-features = false, features = ["status", "index", "revision", "sha1"] }
merman = "=0.8.0-alpha.5"
resvg = "0.48"
serde_json = "1.0.151"
wasmtime = { version = "48", default-features = false, features = ["runtime", "component-model", "cranelift", "parallel-compilation"] }
wasmtime-wasi = "48"
regex = "1.13.1"
ureq = "3"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tempfile = "3"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
# test-support unlocks TestAppContext/VisualTestContext for driving the
# GPUI shell headlessly; feature unification scopes it to test builds.
gpui = { version = "0.2.2", features = ["runtime_shaders", "test-support"] }
layout-rs = "0.1.3"

[profile.release]
strip = true
lto = "thin"

# gpui is heavy; keep debug builds usable
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# merman-render 0.8.0-alpha.5 fails type inference on current rustc
# (ambiguous [u8]::as_ref at two call sites). Vendored with a 2-line
# fix; drop this patch when upstream ships a compiling release.
[patch.crates-io]
merman-render = { path = "vendor/merman-render" }

[build-dependencies]
winresource = "0.1.31"

[package.metadata.deb]
name = "supermd"
section = "editors"
copyright = "2026, SuperJackfruitLabs"
extended-description = "A native, GPU-rendered Markdown editor. Hybrid WYSIWYG, live tables and mermaid diagrams, git diffs — plain CommonMark files on disk."
assets = [
    ["target/release/supermd", "usr/bin/", "755"],
    ["assets/linux/supermd.desktop", "usr/share/applications/", "644"],
    ["assets/linux/supermd-128.png", "usr/share/icons/hicolor/128x128/apps/supermd.png", "644"],
    ["assets/linux/supermd-512.png", "usr/share/icons/hicolor/512x512/apps/supermd.png", "644"],
    ["dist/default-plugins/**/*", "usr/lib/supermd/plugins/", "644"],
]
