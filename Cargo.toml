[package]
name = "supermd"
version = "0.0.4"
edition = "2021"

[dependencies]
# runtime_shaders: compile Metal shaders at launch — avoids requiring full Xcode
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
pulldown-cmark = "0.13"
ropey = "1"
nucleo-matcher = "0.3.1"
unicode-segmentation = "1"
notify = "6"
anyhow = "1.0.104"
inkjet = { version = "0.11.1", features = ["all_languages"] }
tree-sitter-xml = "0.7"
tree-sitter = "0.23"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
similar = { version = "2", features = ["unicode"] }
ignore = "0.4.33"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
gix = { version = "0.87.0", default-features = false, features = ["status", "index", "revision", "sha1"] }
merman = "=0.8.0-alpha.5"
resvg = "0.48"
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"

# gpui is heavy; keep debug builds usable
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# merman-render 0.8.0-alpha.5 fails type inference on current rustc
# (ambiguous [u8]::as_ref at two call sites). Vendored with a 2-line
# fix; drop this patch when upstream ships a compiling release.
[patch.crates-io]
merman-render = { path = "vendor/merman-render" }
