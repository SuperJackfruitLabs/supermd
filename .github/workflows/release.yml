name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: Build, sign, notarize macOS app
    runs-on: macos-latest
    env:
      # `secrets` is not a valid context in step-level `if`; bridge it.
      HAVE_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Import signing certificate
        if: ${{ env.HAVE_CERT == 'true' }}
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERT_P12" | base64 -d > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm cert.p12
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -1 \
            | sed 's/.*"\(.*\)"/\1/')
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing as: $IDENTITY"

      - name: Build plugins (bundle payload)
        run: bash scripts/build_plugins.sh
      - name: Bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/bundle_macos.sh "$VERSION"

      - name: Notarize and staple
        if: ${{ env.SIGN_IDENTITY != '' }}
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY_P8" | base64 -d > notary.p8
          DMG=$(ls dist/supermd-*.dmg)
          # Retry: --wait can die on transient runner network blips, and
          # resubmitting the same file is deduped by hash on Apple's side,
          # so a retry just resumes waiting on the same submission.
          OK=false
          for attempt in 1 2 3; do
            if xcrun notarytool submit "$DMG" \
              --key notary.p8 \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" \
              --wait --timeout 2h; then
              OK=true
              break
            fi
            echo "notarytool attempt $attempt failed; retrying in 30s…"
            sleep 30
          done
          rm notary.p8
          [ "$OK" = true ] || { echo "notarization did not complete"; exit 1; }
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature -v "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/supermd-*.dmg
          if-no-files-found: error

  mas:
    name: Build App Store package
    runs-on: macos-latest
    env:
      # `secrets` is not a valid context in a job- or step-level `if`;
      # bridge it, exactly as the `macos` job does.
      HAVE_CERT: ${{ secrets.MAS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Import Apple Distribution and installer certificates
        if: ${{ env.HAVE_CERT == 'true' }}
        env:
          CERT_P12: ${{ secrets.MAS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
          INSTALLER_P12: ${{ secrets.MAS_INSTALLER_P12 }}
          INSTALLER_PASSWORD: ${{ secrets.MAS_INSTALLER_PASSWORD }}
          PROFILE_B64: ${{ secrets.MAS_PROFILE }}
        run: |
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Two identities: "Apple Distribution" signs the .app,
          # "3rd Party Mac Developer Installer" signs the .pkg.
          echo "$CERT_P12" | base64 -d > app.p12
          echo "$INSTALLER_P12" | base64 -d > installer.p12
          security import app.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security import installer.p12 -k "$KEYCHAIN" -P "$INSTALLER_PASSWORD" \
            -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm app.p12 installer.p12
          APP_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Apple Distribution" | head -1 \
            | sed 's/.*"\(.*\)"/\1/')
          INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN" \
            | grep "3rd Party Mac Developer Installer" | head -1 \
            | sed 's/.*"\(.*\)"/\1/')
          echo "APP_IDENTITY=$APP_IDENTITY" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          echo "$PROFILE_B64" | base64 -d > mas.provisionprofile
          echo "PROFILE=$PWD/mas.provisionprofile" >> "$GITHUB_ENV"
          echo "Signing as: $APP_IDENTITY / $INSTALLER_IDENTITY"

      - name: Build plugins
        if: ${{ env.HAVE_CERT == 'true' }}
        run: bash scripts/build_plugins.sh
      - name: Bundle
        if: ${{ env.HAVE_CERT == 'true' }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}" bash scripts/bundle_mas.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        if: ${{ env.HAVE_CERT == 'true' }}
        with:
          name: mas
          path: dist/SuperMD-mas-*.pkg
          if-no-files-found: error

  linux:
    name: Build Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libfontconfig1-dev \
            libfreetype6-dev
      - name: Build plugins
        run: |
          bash scripts/build_plugins.sh
      - name: Bundle tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/bundle_linux.sh "$VERSION"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Build deb
        run: cargo deb --no-build -o dist/
      - name: Zip plugins
        run: |
          (cd dist && zip -r supermd-plugins.zip plugins)
          for d in dist/plugins/*/; do
            name=$(basename "$d")
            (cd dist/plugins && zip -r "../plugin-$name.zip" "$name")
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/supermd-linux-*.tar.gz
            dist/*.deb
            dist/supermd-plugins.zip
            dist/plugin-*.zip
          if-no-files-found: error

  windows:
    name: Build Windows packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build plugins (installer payload)
        shell: bash
        run: bash scripts/build_plugins.sh
      - name: Bundle
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          if (-not $version) { $version = "0.0.0-dev" }
          pwsh scripts/bundle_windows.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/supermd-windows-*.zip
            dist/SuperMD-Setup-*.exe
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The App Store package is uploaded to App Store Connect via
          # Transporter, never attached to a GitHub Release. merge-multiple
          # pulls every artifact in the run, so drop it explicitly.
          rm -f artifacts/SuperMD-mas-*.pkg
          ls -la artifacts/
          gh release create "$GITHUB_REF_NAME" \
            artifacts/* \
            --title "SuperMD $GITHUB_REF_NAME" \
            --generate-notes
