name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Test & Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test
      - name: Build
        run: cargo build
