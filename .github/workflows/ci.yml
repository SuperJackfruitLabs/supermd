name: CI

# site/** and docs/** never affect the binary, so website and spec
# changes skip app CI entirely. Root-level markdown (WELCOME.md, plugin
# READMEs) is NOT ignored — some of it is compiled into the app.
on:
  push:
    branches: [master]
    # WELCOME.md stays CI-relevant: it is compiled into the binary.
    paths-ignore: ['site/**', 'docs/**', 'README.md']
  pull_request:
    # WELCOME.md stays CI-relevant: it is compiled into the binary.
    paths-ignore: ['site/**', 'docs/**', 'README.md']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libfontconfig1-dev \
            libfreetype6-dev
      - name: Build plugin fixtures (Linux exercises host tests)
        if: runner.os == 'Linux'
        run: bash scripts/build_plugins.sh --fixtures
      - name: Run tests
        run: cargo test
      - name: Build
        run: cargo build
      # The sandboxed App Store configuration is a different feature set
      # (Pulley host, no wasm grammars), so it can rot silently unless it
      # is built and tested too. macOS only — `mas` is a macOS target.
      - name: Build the App Store configuration
        if: runner.os == 'macOS'
        run: cargo build --no-default-features --features mas
      - name: Test the App Store configuration
        if: runner.os == 'macOS'
        run: cargo test --no-default-features --features mas

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libfontconfig1-dev \
            libfreetype6-dev
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Build plugin fixtures (extension host tests need them)
        run: bash scripts/build_plugins.sh --fixtures
      - name: Measure coverage
        # Whole project, no exclusions. The residue is documented at each
        # site: OS dialogs the headless test platform leaves unimplemented,
        # network fetches, and the live window bootstrap in main's run().
        # --fail-under-lines is the enforcement: CI fails if whole-project
        # line coverage drops below 90%.
        run: |
          cargo llvm-cov --json --summary-only --fail-under-lines 90 > coverage.json
          PCT=$(jq -r '.data[0].totals.lines.percent | . * 10 | round / 10' coverage.json)
          echo "PCT=$PCT" >> "$GITHUB_ENV"
          echo "### Test coverage: ${PCT}% (lines)" >> "$GITHUB_STEP_SUMMARY"
      - name: Update coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 9fb5226b83eda4ae8cb0568e7bc7755f
          filename: supermd-coverage.json
          label: coverage
          message: ${{ env.PCT }}%
          valColorRange: ${{ env.PCT }}
          minColorRange: 40
          maxColorRange: 90
