name = "Graphite"
appearance = "dark"

[colors]
bg = "#161615"
fg = "#d6d4cf"
fg_strong = "#f1efec"
fg_muted = "#8b8984"
accent = "#e25d5f"
link = "#e25d5f"
code_bg = "#2a2a28"
code_fg = "#ccc9c2"
border = "#343432"
# #1f1f1e is what Graphite means by "graphite", so it goes on the page,
# where the reading happens; the desk is the same neutral one step
# beneath. The code fence keeps its old relation to it and so stays a
# visible lift rather than collapsing into the surface underneath.
page_bg = "#1f1f1e"
# Neutral through and through: Graphite has no hue to protect, so the
# page casts a plain black shadow.
shadow = "#00000057"
# panel_bg is not only the sidebar: the table projector paints the
# header row with it, on the page. At #1d1d1b that band was 1.023:1
# against the page -- two levels out of 255, invisible. Dropped one step
# towards the desk, which reads as a recess in the sheet and leaves the
# sidebar still a hair above the ground.
panel_bg = "#1a1a19"
hover_bg = "#272725"
selected_bg = "#31312e"
find_match_bg = "#51431a"
find_active_bg = "#7a6220"

[syntax]
keyword = "#c678dd"
function = "#61afef"
type = "#e5c07b"
string = "#98c379"
comment = "#6b7280"
constant = "#d19a66"
property = "#e06c75"
operator = "#8a919c"
tag = "#e06c75"
attribute = "#d19a66"
