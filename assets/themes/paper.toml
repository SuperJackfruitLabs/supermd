name = "Paper"
appearance = "light"

[colors]
bg = "#f4f3f1"
fg = "#37352f"
fg_strong = "#1d1c19"
# Four levels down from #8f8d87: the ground is no longer white, and the
# old value only just held 3:1 against white.
fg_muted = "#8b8983"
accent = "#dd4c4f"
link = "#dd4c4f"
code_bg = "#f6f5f3"
code_fg = "#484744"
# Also darkened, or the hairline vanishes against the stepped-down
# panel.
border = "#e0dfdc"
# Paper is a white-page theme, so the page keeps the white and the desk
# gives it up: a pure-white ground leaves the page nowhere brighter to
# go, and a page darker than its desk is a hole, not a sheet. Every
# chrome surface steps down with the ground, because every one of them
# was tuned against white.
page_bg = "#ffffff"
# Neutral warm-grey. Paper has no hue of its own to protect.
shadow = "#33312d2e"
panel_bg = "#ecebe9"
hover_bg = "#e1e0dd"
selected_bg = "#dbd8d2"
find_match_bg = "#ffe9a3"
find_active_bg = "#ffc94d"

[syntax]
keyword = "#a626a4"
function = "#4078f2"
type = "#c18401"
string = "#50a14f"
comment = "#a2a3a7"
constant = "#986801"
property = "#e45649"
operator = "#707277"
tag = "#e45649"
attribute = "#986801"
