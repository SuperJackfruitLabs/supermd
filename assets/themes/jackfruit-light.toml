name = "Jackfruit Light"
appearance = "light"

[colors]
bg = "#f8f4ea"
fg = "#353027"
fg_strong = "#221f19"
# Muted ink has to read on five surfaces, not one: the desk, the page,
# the sidebar, a hovered row and a SELECTED row. selected_bg is the far
# end of that ramp and the binding one -- the finder's directory hint,
# the palette's plugin name, the search results' line numbers and the
# `[[` popup's path hint are all fg_muted on a selected row.
fg_muted = "#827969"
accent = "#c9821c"
link = "#c9821c"
code_bg = "#f6f2e9"
code_fg = "#4a463d"
border = "#eae5d8"
# The warm cream IS Jackfruit Light -- it is the default theme and the
# defaults carry the identity -- so the cream goes on the page rather
# than being traded for pure white, and the desk is the same cream one
# step down. Ink matches `Theme::light()` exactly; the Rust default is
# a fallback nothing reaches, and this file is what a user sees.
page_bg = "#fdfbf6"
# Warm brown at low strength. A grey shadow on cream reads as dirt.
shadow = "#3c30202e"
panel_bg = "#f3efe2"
hover_bg = "#ebe6d8"
selected_bg = "#e3dcc9"
find_match_bg = "#f6e3a8"
find_active_bg = "#ecc153"

[syntax]
keyword = "#a626a4"
function = "#4078f2"
type = "#c18401"
string = "#50a14f"
comment = "#a2a3a7"
constant = "#986801"
property = "#e45649"
operator = "#707277"
tag = "#e45649"
attribute = "#986801"
