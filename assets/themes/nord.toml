name = "Nord"
appearance = "dark"

[colors]
bg = "#272c36"
fg = "#d8dee9"
fg_strong = "#eceff4"
# nord3-bright (#616e88) never reached 3:1 against any Nord background;
# this is the same blue-grey carried far enough up the ramp to be read.
# Code comments keep #616e88, which sits on the lighter code fence.
fg_muted = "#748199"
accent = "#bf616a"
link = "#88c0d0"
code_bg = "#3b4252"
code_fg = "#d8dee9"
border = "#434c5e"
# nord0 is Nord's background, so nord0 is the page. Polar Night has
# nothing darker, so the desk is nord0 taken down one step -- same hue,
# no warming. Nord is cold on purpose.
page_bg = "#2e3440"
# A blue-black rather than black, so the shadow deepens the ground's
# hue instead of draining it.
shadow = "#10141c57"
panel_bg = "#22262f"
hover_bg = "#343a48"
selected_bg = "#3c4454"
find_match_bg = "#665c22"
find_active_bg = "#8a7d33"

[syntax]
keyword = "#81a1c1"
function = "#88c0d0"
type = "#8fbcbb"
string = "#a3be8c"
comment = "#616e88"
constant = "#b48ead"
property = "#d08770"
operator = "#81a1c1"
tag = "#81a1c1"
attribute = "#8fbcbb"
