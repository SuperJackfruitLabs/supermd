name = "Solarized Dark"
appearance = "dark"

[colors]
bg = "#001d24"
fg = "#839496"
fg_strong = "#eee8d5"
# base00, not base01. Muted text is painted on the PAGE (base03), and
# base01 there is 2.79:1 -- under the floor, and unchanged by the desk
# moving beneath it. base00 is the next published role up the ramp and
# reaches 3.37:1 on the page, 3.69 on the sidebar, 3.93 on the desk.
# Solarized does not publish a role for secondary chrome text, so this
# picks one from the sixteen rather than inventing a colour; base01
# stays exactly where Solarized does define it, as `comment` below.
fg_muted = "#657b83"
accent = "#dc322f"
link = "#268bd2"
code_bg = "#073642"
code_fg = "#93a1a1"
border = "#0e3a46"
# base03 is the background base0 body text was designed against, and
# base0 on anything brighter falls under 4.5:1. So the page keeps the
# published pairing and the desk -- which carries no body text -- takes
# the invented step down instead.
page_bg = "#002b36"
# Solarized's own dark end, so the shadow stays in the teal.
shadow = "#00161c57"
panel_bg = "#02232c"
hover_bg = "#083440"
selected_bg = "#114450"
find_match_bg = "#58500e"
find_active_bg = "#8a7a1a"

[syntax]
keyword = "#859900"
function = "#268bd2"
type = "#b58900"
string = "#2aa198"
comment = "#586e75"
constant = "#cb4b16"
property = "#dc322f"
operator = "#839496"
tag = "#268bd2"
attribute = "#b58900"
